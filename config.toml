# Codex configuration for Docker sandbox
# This configuration enables "yolo mode" - no approvals, full access
# No model is pinned here: the default comes from the lowest-priority entry in model_catalog_json.
# The provider placeholder below is replaced by install.sh with the selected backend.

approval_policy = "never"
sandbox_mode = "danger-full-access"
mcp_oauth_credentials_store = "file"

model_provider = "custom"
model_context_window = 272000
model_auto_compact_token_limit = 240000
web_search = "live"
model_catalog_json = "~/.codex/models.json"

[features]
memories = true
goals = true
multi_agent = true
multi_agent_v2 = true

# __CUSTOM_PROVIDER__

[agents]
enabled = true
max_concurrent_threads_per_session = 8
