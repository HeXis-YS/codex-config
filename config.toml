# Codex configuration for Docker sandbox
# This configuration enables "yolo mode" - no approvals, full access
# No model is pinned here: the default comes from the lowest-priority entry in model_catalog_json.
# The provider template below is filled in by install.sh for the selected backend.

approval_policy = "never"
sandbox_mode = "danger-full-access"
mcp_oauth_credentials_store = "file"

model_provider = "custom"
model_catalog_json = "~/.codex/models.json"

[features]
memories = true
multi_agent_v2 = true

[tools.update_plan]
enabled = true

# Provider template: install.sh replaces the name, base_url and bearer token
# placeholders with the values of the selected backend.
[model_providers.custom]
name = "__PROVIDER_NAME__"
base_url = "__PROVIDER_BASE_URL__"
experimental_bearer_token = "__PROVIDER_TOKEN__"
supports_standalone_web_search = true

# MCP server proxy configuration (for Node.js-based MCP servers):
# If MCP servers need to access external APIs through a proxy, add NODE_OPTIONS to their env section.
# Example:
#
# [mcp_servers.example_server]
# command = "npx"
# args = ["-y", "example-mcp-package"]
# [mcp_servers.example_server.env]
# NODE_OPTIONS = "--require /home/agent/.codex/proxy-setup.cjs"
# API_KEY = "your-api-key"
#
# For non-Node.js MCP servers, use standard HTTP_PROXY/HTTPS_PROXY environment variables if supported.

# ds-websearch-mcp: Web search capability for models without native search
# Provides web_search tool using DeepSeek's search API
[mcp_servers.ds-websearch-mcp]
command = "npx"
args = ["-y", "ds-websearch-mcp"]

[mcp_servers.ds-websearch-mcp.env]
DEEPSEEK_API_KEY = "sbx-cs-deepseek"
NODE_OPTIONS = "--require /home/agent/.codex/proxy-setup.cjs"
